services:
  postgres:
    image: postgres:18-alpine
    # SSD/in-memory costs: the default random_page_cost (4, spinning disks) makes the planner hash all 125k variants
    # instead of probing the few thousand a category page needs. Managed databases on SSD should use the same.
    command: ["postgres", "-c", "random_page_cost=1.1"]
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - commerce-postgres:/var/lib/postgresql

  keycloak-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_local_dev_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - keycloak-postgres:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_local_dev_only}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-local-admin-change-me}
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      STOREFRONT_CLIENT_SECRET: ${KEYCLOAK_STOREFRONT_CLIENT_SECRET:-storefront-local-dev-secret-change-me}
      ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-admin-local-dev-secret-change-me}
      DEV_CUSTOMER_PASSWORD: ${KEYCLOAK_CUSTOMER_PASSWORD:-CustomerLocal123!}
      DEV_SUPPORT_PASSWORD: ${KEYCLOAK_SUPPORT_PASSWORD:-SupportLocal123!}
      DEV_CATALOG_MANAGER_PASSWORD: ${KEYCLOAK_CATALOG_MANAGER_PASSWORD:-CatalogLocal123!}
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c "exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - ./keycloak/commerce-realm.json:/opt/keycloak/data/import/commerce-realm.json:ro
    depends_on:
      keycloak-postgres:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/src/Commerce.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_URL: Host=postgres;Port=5432;Database=commerce;Username=commerce;Password=commerce_dev
      CACHE_PROVIDER: valkey
      CACHE_CONNECTION: valkey:6379,connectTimeout=500,abortConnect=false
      CACHE_OPERATION_TIMEOUT_MS: "300"
      CACHE_ENABLED: "true"
      APPLY_MIGRATIONS: "true"
      ALLOW_DEVELOPMENT_IDENTITY: "true"
      SYNTHETIC_CATALOG_PRODUCTS: ${SYNTHETIC_CATALOG_PRODUCTS:-0}
      FRONTEND_ORIGIN: http://localhost:3000
      AUTH_AUTHORITY: http://localhost:8081/realms/commerce
      AUTH_METADATA_ADDRESS: http://keycloak:8080/realms/commerce/.well-known/openid-configuration
      AUTH_AUDIENCE: commerce-api
      AUTH_ROLE_CLIENT_ID: commerce-api
      PUBLIC_HOSTS: ${PUBLIC_HOSTS:-localhost;127.0.0.1;api}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy

  storefront:
    build:
      context: ..
      dockerfile: apps/storefront/Dockerfile
    environment:
      API_URL: http://api:8080
      APP_URL: http://localhost:3000
      REDIS_URL: redis://valkey:6379
      OIDC_ISSUER: http://localhost:8081/realms/commerce
      OIDC_METADATA_URL: http://keycloak:8080/realms/commerce/.well-known/openid-configuration
      OIDC_ALLOW_INSECURE: "true"
      OIDC_CLIENT_ID: storefront-web
      OIDC_CLIENT_SECRET: ${KEYCLOAK_STOREFRONT_CLIENT_SECRET:-storefront-local-dev-secret-change-me}
      OIDC_REDIRECT_URI: http://localhost:3000/api/auth/callback
      SESSION_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      api:
        condition: service_healthy
      valkey:
        condition: service_healthy

  admin:
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    environment:
      API_URL: http://api:8080
      APP_URL: http://localhost:3001
      REDIS_URL: redis://valkey:6379
      OIDC_ISSUER: http://localhost:8081/realms/commerce
      OIDC_METADATA_URL: http://keycloak:8080/realms/commerce/.well-known/openid-configuration
      OIDC_ALLOW_INSECURE: "true"
      OIDC_CLIENT_ID: admin-web
      OIDC_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:-admin-local-dev-secret-change-me}
      SESSION_COOKIE_SECURE: "false"
      SESSION_TTL_SECONDS: "28800"
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      valkey:
        condition: service_healthy

  loadtest:
    image: grafana/k6:latest
    profiles: ["load"]
    environment:
      BASE_URL: http://api:8080
    volumes:
      - ../tests/load:/scripts:ro
    command: ["run", "/scripts/storefront.js"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  commerce-postgres:
  keycloak-postgres:
