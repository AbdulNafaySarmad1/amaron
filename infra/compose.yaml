services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - commerce-postgres:/var/lib/postgresql

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/src/Commerce.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      DATABASE_URL: Host=postgres;Port=5432;Database=commerce;Username=commerce;Password=commerce_dev
      CACHE_PROVIDER: valkey
      CACHE_CONNECTION: valkey:6379,connectTimeout=500,abortConnect=false
      CACHE_ENABLED: "true"
      APPLY_MIGRATIONS: "true"
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

volumes:
  commerce-postgres:
