services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_dev
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - commerce-postgres:/var/lib/postgresql

  valkey:
    image: valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/src/Commerce.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_URL: Host=postgres;Port=5432;Database=commerce;Username=commerce;Password=commerce_dev
      CACHE_PROVIDER: valkey
      CACHE_CONNECTION: valkey:6379,connectTimeout=500,abortConnect=false
      CACHE_OPERATION_TIMEOUT_MS: "300"
      CACHE_ENABLED: "true"
      APPLY_MIGRATIONS: "true"
      ALLOW_DEVELOPMENT_IDENTITY: "true"
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy

  storefront:
    build:
      context: ..
      dockerfile: apps/storefront/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_DEMO_CUSTOMER_ID: storefront-demo
    environment:
      API_URL: http://api:8080
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

  loadtest:
    image: grafana/k6:latest
    profiles: ["load"]
    environment:
      BASE_URL: http://api:8080
    volumes:
      - ../tests/load:/scripts:ro
    command: ["run", "/scripts/storefront.js"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  commerce-postgres:
